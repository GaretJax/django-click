repos:
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.0
    hooks:
    -   id: pyupgrade
        args: ["--py310-plus"]

-   repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8
        additional_dependencies: [Flake8-pyproject]

-   repo: https://github.com/adamchainz/django-upgrade
    rev: 1.31.1
    hooks:
    -   id: django-upgrade
        args: [--target-version, "5.2"]
